# AgentJetson core stack.
#
#   make up          # or: docker compose up -d
#   make schema      # re-apply DDL (idempotent)
#   make seed        # demo rows
#
# Env expected by consumers:
#   CLICKHOUSE_HOST / PORT / USER / PASSWORD / DB
#   NATS_URL

name: agentjetson-core

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: aj-clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "pass"
      CLICKHOUSE_DB: default
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./seed/sql/001_database.sql:/docker-entrypoint-initdb.d/001_database.sql:ro
      - ./seed/sql/002_tables.sql:/docker-entrypoint-initdb.d/002_tables.sql:ro
      - ./seed/sql/003_views.sql:/docker-entrypoint-initdb.d/003_views.sql:ro
      - ./seed/sql/004_seed.sql:/docker-entrypoint-initdb.d/004_seed.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats-publisher:
    build:
      context: .
      dockerfile: nats-publisher/Dockerfile
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      GRPC_ADDR: 0.0.0.0:50051
    ports:
      - "50051:50051"
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    environment:
      GRPC_ADDR: 0.0.0.0:50052
      PUBLISHER_ADDR: nats-publisher:50051
    depends_on:
      - nats-publisher
    ports:
      - "50052:50052"
    restart: unless-stopped

  # Per-camera decision gate: profile short-circuit + audio intent → SceneResult
  scene-gate:
    build:
      context: .
      dockerfile: scene-gate/Dockerfile
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      INGEST_ADDR: ingest:50052
      TAXONOMY_PATH: /config/taxonomy.yaml
      CAMERA_PROFILES_PATH: /config/camera_profiles.yaml
      CAMERA_SOURCES_PATH: /config/camera_sources.yaml
      STREAM_AUDIO: AUDIO_EVENTS
      AUDIO_SUBJECT: audio.transcript
      PUBLISH_VIA_INGEST: "true"
      EMIT_PROFILES: "true"
      # PROFILE_REFRESH_MIN: "15"   # optional re-emit; 0 = startup only
    depends_on:
      nats:
        condition: service_healthy
      ingest:
        condition: service_started
    restart: unless-stopped

  # Pure NATS correlator — durables agg-objects / agg-results on CV_EVENTS
  aggregator:
    build:
      context: .
      dockerfile: aggregator/Dockerfile
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      STREAM_EVENTS: CV_EVENTS
      STREAM_ALERTS: CV_ALERTS
      EMIT_TIMEOUT_MS: "800"
      FETCH_BATCH: "8"
      FETCH_TIMEOUT_MS: "200"
    depends_on:
      nats:
        condition: service_healthy
      nats-publisher:
        condition: service_started
    restart: unless-stopped

  clickhouse-consumer:
    build:
      context: .
      dockerfile: clickhouse-consumer/Dockerfile
    container_name: aj-clickhouse-consumer
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "pass"
      CLICKHOUSE_DB: default
      FLUSH_MS: "500"
      FLUSH_SIZE: "32"
    depends_on:
      clickhouse:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  # S3-compatible object store (RustFS — Apache-2.0 MinIO alternative).
  # Producers (camera-connector --ingest, audio-client) write via object-storage.
  # Credentials accept both RUSTFS_* (canonical) and MINIO_* (compat aliases).
  rustfs:
    image: rustfs/rustfs:latest
    container_name: aj-rustfs
    command: ["/data", "--console-enable", "--console-address", ":9001"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-minioadmin}
      # MinIO-compat aliases still accepted by RustFS
      MINIO_ROOT_USER: ${RUSTFS_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${RUSTFS_SECRET_KEY:-minioadmin}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9010:9000"   # S3 API (host 9010 to avoid clash with ClickHouse :9000)
      - "9001:9001"   # Console
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  object-storage:
    build:
      context: .
      dockerfile: object-storage/Dockerfile
    environment:
      DEMO_MODE: "false"
      CLICKHOUSE_ENABLED: "true"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: pass
      CLICKHOUSE_DB: default
      STORAGE_BACKEND: minio
      S3_ENDPOINT: rustfs:9000
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-minioadmin}
      S3_BUCKET: agentjetson
      S3_USE_SSL: "false"
      S3_FORCE_PATH_STYLE: "true"
      GRPC_ADDR: 0.0.0.0:50055
      HTTP_ADDR: 0.0.0.0:8081
    ports:
      - "8081:8081"
      - "50055:50055"
    depends_on:
      clickhouse:
        condition: service_healthy
      rustfs:
        condition: service_started
    restart: unless-stopped

  voice-query-service:
    build:
      context: .
      dockerfile: query-service/Dockerfile
    container_name: voice-query-service
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DEMO_MODE: "${DEMO_MODE:-false}"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: pass
      CLICKHOUSE_DATABASE: default
      APPLY_SCHEMA: "false"
      DEFAULT_TIME_WINDOW_SEC: "${DEFAULT_TIME_WINDOW_SEC:-30}"
      DEFAULT_LIMIT: "${DEFAULT_LIMIT:-5}"
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

volumes:
  clickhouse-data:
  rustfs_data:
