# AgentJetson core stack.
#
#   make up          # or: docker compose up -d
#   make schema      # re-apply DDL (idempotent)
#   make seed        # demo rows
#
# Env expected by consumers:
#   CLICKHOUSE_HOST / PORT / USER / PASSWORD / DB
#   NATS_URL
#   OTEL_EXPORTER_OTLP_ENDPOINT (default otel-collector:4317)
#
# Observability (LGT):
#   Grafana  http://localhost:3000  (admin/admin)
#   Tempo    http://localhost:3200
#   Loki     http://localhost:3100

name: aj-core

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
  OTEL_EXPORTER_OTLP_INSECURE: "true"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "pass"
      CLICKHOUSE_DB: default
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./seed/sql/001_database.sql:/docker-entrypoint-initdb.d/001_database.sql:ro
      - ./seed/sql/002_tables.sql:/docker-entrypoint-initdb.d/002_tables.sql:ro
      - ./seed/sql/003_views.sql:/docker-entrypoint-initdb.d/003_views.sql:ro
      - ./seed/sql/004_seed.sql:/docker-entrypoint-initdb.d/004_seed.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats-publisher:
    build:
      context: .
      dockerfile: nats-publisher/Dockerfile
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: nats-publisher
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      GRPC_ADDR: 0.0.0.0:50051
    ports:
      - "50051:50051"
    depends_on:
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: ingest
      GRPC_ADDR: 0.0.0.0:50052
      PUBLISHER_ADDR: nats-publisher:50051
    depends_on:
      nats-publisher:
        condition: service_started
      otel-collector:
        condition: service_started
    ports:
      - "50052:50052"
    restart: unless-stopped

  # Per-camera decision gate: profile + audio intent + cv.source.* → SceneResult
  scene-gate:
    build:
      context: .
      dockerfile: scene-gate/Dockerfile
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: scene-gate
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      INGEST_ADDR: ingest:50052
      TAXONOMY_PATH: /config/taxonomy.yaml
      CAMERA_PROFILES_PATH: /config/camera_profiles.yaml
      CAMERA_SOURCES_PATH: /config/camera_sources.yaml
      STREAM_AUDIO: AUDIO_EVENTS
      STREAM_EVENTS: CV_EVENTS
      AUDIO_SUBJECT: audio.transcript
      SOURCE_SUBJECT: cv.source.>
      DYNAMIC_SOURCES: "true"
      SOURCE_DEBOUNCE_SEC: "60"
      PUBLISH_VIA_INGEST: "true"
      EMIT_PROFILES: "true"
    depends_on:
      nats:
        condition: service_healthy
      ingest:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped

  # Pure NATS correlator — durables agg-objects / agg-results on CV_EVENTS
  aggregator:
    build:
      context: .
      dockerfile: aggregator/Dockerfile
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: aggregator
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      STREAM_EVENTS: CV_EVENTS
      STREAM_ALERTS: CV_ALERTS
      EMIT_TIMEOUT_MS: "800"
      FETCH_BATCH: "8"
      FETCH_TIMEOUT_MS: "200"
    depends_on:
      nats:
        condition: service_healthy
      nats-publisher:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped

  clickhouse-consumer:
    build:
      context: .
      dockerfile: clickhouse-consumer/Dockerfile
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: clickhouse-consumer
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "pass"
      CLICKHOUSE_DB: default
      FLUSH_MS: "500"
      FLUSH_SIZE: "32"
    depends_on:
      clickhouse:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    command: ["/data", "--console-enable", "--console-address", ":9001"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-minioadmin}
      MINIO_ROOT_USER: ${RUSTFS_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${RUSTFS_SECRET_KEY:-minioadmin}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9010:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  object-storage:
    build:
      context: .
      dockerfile: object-storage/Dockerfile
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: object-storage
      DEMO_MODE: "false"
      CLICKHOUSE_ENABLED: "true"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: pass
      CLICKHOUSE_DB: default
      STORAGE_BACKEND: minio
      S3_ENDPOINT: rustfs:9000
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-minioadmin}
      S3_BUCKET: agentjetson
      S3_USE_SSL: "false"
      S3_FORCE_PATH_STYLE: "true"
      GRPC_ADDR: 0.0.0.0:50055
      HTTP_ADDR: 0.0.0.0:8081
    ports:
      - "8081:8081"
      - "50055:50055"
    depends_on:
      clickhouse:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  voice-query-service:
    build:
      context: .
      dockerfile: query-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: voice-query-service
      HTTP_ADDR: ":8080"
      DEMO_MODE: "${DEMO_MODE:-false}"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: pass
      CLICKHOUSE_DATABASE: default
      APPLY_SCHEMA: "false"
      DEFAULT_TIME_WINDOW_SEC: "${DEFAULT_TIME_WINDOW_SEC:-30}"
      DEFAULT_LIMIT: "${DEFAULT_LIMIT:-5}"
    depends_on:
      clickhouse:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  # --- LGT observability -----------------------------------------------------

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo query API (Grafana)
      # OTLP ports stay internal; only the collector talks to them.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clickhouse-data:
  rustfs_data:
  tempo-data:
  loki-data:
  grafana-data: