# ClickHouse-only adapter. No NATS, no core, no query-service.
# Core and voice-query-service point at this instance.
#
#   make up          # or: docker compose up -d
#   make schema      # re-apply DDL (idempotent)
#   make seed        # demo rows (seed.cam-*, seed.mic-*)
#
# Env expected by consumers (same names as core compose):
#   CLICKHOUSE_HOST=localhost
#   CLICKHOUSE_PORT=9000
#   CLICKHOUSE_USER=default
#   CLICKHOUSE_PASSWORD=pass
#   CLICKHOUSE_DB=default

name: agentjetson-contract

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: aj-clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "pass"
      CLICKHOUSE_DB: default
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./seed/sql/001_database.sql:/docker-entrypoint-initdb.d/001_database.sql:ro
      - ./seed/sql/002_tables.sql:/docker-entrypoint-initdb.d/002_tables.sql:ro
      - ./seed/sql/003_views.sql:/docker-entrypoint-initdb.d/003_views.sql:ro
      - ./seed/sql/004_seed.sql:/docker-entrypoint-initdb.d/004_seed.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/agentjetson;
      mc anonymous set download local/agentjetson || true;
      exit 0;
      "

  object-storage:
    build:
      context: ./object-storage
      dockerfile: Dockerfile
    environment:
      DEMO_MODE: "false"
      CLICKHOUSE_ENABLED: "true"
      CLICKHOUSE_DSN: clickhouse://default:pass@clickhouse:9000/default
      STORAGE_BACKEND: minio
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: agentjetson
      S3_USE_SSL: "false"
      S3_FORCE_PATH_STYLE: "true"
      GRPC_ADDR: 0.0.0.0:50055
      HTTP_ADDR: 0.0.0.0:8081
    ports:
      - "8081:8081"
      - "50055:50055"
    depends_on:
      - minio-init
    restart: unless-stopped
    networks:
      - core_net

  voice-query-service:
    build:
      context: ./query-service
      dockerfile: Dockerfile
    container_name: voice-query-service
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DEMO_MODE: "${DEMO_MODE:-true}"
      CLICKHOUSE_HOST: "${CLICKHOUSE_HOST:-localhost}"
      CLICKHOUSE_PORT: "${CLICKHOUSE_PORT:-9000}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-pass}"
      CLICKHOUSE_DATABASE: "${CLICKHOUSE_DATABASE:-default}"
      APPLY_SCHEMA: "${APPLY_SCHEMA:-true}"
      NATS_URL: "${NATS_URL:-nats://localhost:4222}"
      NATS_ENABLE_LIVE: "${NATS_ENABLE_LIVE:-false}"
      DEFAULT_TIME_WINDOW_SEC: "${DEFAULT_TIME_WINDOW_SEC:-30}"
      DEFAULT_LIMIT: "${DEFAULT_LIMIT:-5}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    depends_on:
      - clickhouse
      - nats
    networks:
      - core_net

networks:
  core_net:
    external: true
    name: ${CORE_NETWORK:-core_default}

volumes:
  clickhouse-data:
  minio_data: