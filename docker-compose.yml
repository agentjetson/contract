# AgentJetson contract stack: ClickHouse + JetStream consumers + storage + query.
#
#   make up          # or: docker compose up -d
#   make schema      # re-apply DDL (idempotent)
#   make seed        # demo rows (seed.cam-*, seed.mic-*)
#
# Env expected by consumers:
#   CLICKHOUSE_HOST / PORT / USER / PASSWORD / DB
#   NATS_URL

name: agentjetson-contract

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: aj-clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "pass"
      CLICKHOUSE_DB: default
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./seed/sql/001_database.sql:/docker-entrypoint-initdb.d/001_database.sql:ro
      - ./seed/sql/002_tables.sql:/docker-entrypoint-initdb.d/002_tables.sql:ro
      - ./seed/sql/003_views.sql:/docker-entrypoint-initdb.d/003_views.sql:ro
      - ./seed/sql/004_seed.sql:/docker-entrypoint-initdb.d/004_seed.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats-publisher:
    build:
      context: .
      dockerfile: nats-publisher/Dockerfile
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      GRPC_ADDR: 0.0.0.0:50051
    ports:
      - "50051:50051"
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    environment:
      GRPC_ADDR: 0.0.0.0:50052
      PUBLISHER_ADDR: nats-publisher:50051
    depends_on:
      - nats-publisher
    ports:
      - "50052:50052"
    restart: unless-stopped

  aggregator:
    build:
      context: .
      dockerfile: aggregator/Dockerfile
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      STREAM_EVENTS: CV_EVENTS
      STREAM_ALERTS: CV_ALERTS
      EMIT_TIMEOUT_MS: "800"
      FETCH_BATCH: "8"
      FETCH_TIMEOUT_MS: "200"
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  clickhouse-consumer:
    build:
      context: .
      dockerfile: clickhouse-consumer/Dockerfile
    container_name: aj-clickhouse-consumer
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "pass"
      CLICKHOUSE_DB: default
      FLUSH_MS: "500"
      FLUSH_SIZE: "32"
    depends_on:
      clickhouse:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/agentjetson;
      mc anonymous set download local/agentjetson || true;
      exit 0;
      "

  object-storage:
    build:
      context: .
      dockerfile: object-storage/Dockerfile
    environment:
      DEMO_MODE: "false"
      CLICKHOUSE_ENABLED: "true"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: pass
      CLICKHOUSE_DB: default
      STORAGE_BACKEND: minio
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: agentjetson
      S3_USE_SSL: "false"
      S3_FORCE_PATH_STYLE: "true"
      GRPC_ADDR: 0.0.0.0:50055
      HTTP_ADDR: 0.0.0.0:8081
    ports:
      - "8081:8081"
      - "50055:50055"
    depends_on:
      - minio-init
      - clickhouse
    restart: unless-stopped

  voice-query-service:
    build:
      context: .
      dockerfile: query-service/Dockerfile
    container_name: voice-query-service
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DEMO_MODE: "${DEMO_MODE:-false}"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: pass
      CLICKHOUSE_DATABASE: default
      APPLY_SCHEMA: "false"
      DEFAULT_TIME_WINDOW_SEC: "${DEFAULT_TIME_WINDOW_SEC:-30}"
      DEFAULT_LIMIT: "${DEFAULT_LIMIT:-5}"
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

volumes:
  clickhouse-data:
  minio_data:
