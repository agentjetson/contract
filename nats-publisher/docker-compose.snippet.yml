# Drop into contract/docker-compose.yml (or core compose) when ready.
#
# Requires: NATS already running (core stack or external).
# Requires: make generate so gen/go exists for the Dockerfile COPY.

  nats-publisher:
    build:
      context: .
      dockerfile: nats-publisher/Dockerfile
    environment:
      NATS_URL: ${NATS_URL:-nats://host.docker.internal:4222}
      GRPC_ADDR: 0.0.0.0:50051
    ports:
      - "50051:50051"
    restart: unless-stopped
