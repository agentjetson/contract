syntax = "proto3";

package voice.v1;

option cc_enable_arenas = true;
option go_package = "github.com/agentjetson/contract/gen/go/voice/v1;voicev1";

import "google/protobuf/timestamp.proto";

// Request / response shapes for the voice-query-service tools.
// These mirror the JSON HTTP + MCP argument contracts so the C++ voice_agent
// (libcurl) and MCP clients stay compatible.
//
// The Go service stays in its own repo (agentjetson/voice-query-service).
// This file is the source of truth; generate stubs there with Buf
// (see buf.gen.yaml). Query DTOs are named *Hit so they never collide with
// pipeline messages (scene.v1.SceneResult, detection.v1.Detection, ...).

message QueryRecentPlatesRequest {
  string make_model = 1;          // e.g. "Mercedes"
  string vehicle_class = 2;       // e.g. "car"
  string color = 3;
  string scene_l1 = 4;            // e.g. "roadway"
  string camera_id = 5;
  int32 time_window_sec = 6;      // default 30
  int32 limit = 7;                // default 5
}

message PlateHit {
  string plate = 1;
  float confidence = 2;
  string track_id = 3;
  string camera_id = 4;
  string vehicle_class = 5;
  string make_model = 6;
  string color = 7;
  string scene_l1 = 8;
  string scene_l2 = 9;
  google.protobuf.Timestamp observed_at = 10;
}

message QueryRecentPlatesResponse {
  repeated PlateHit results = 1;
}

message QueryObjectsRequest {
  string class = 1;               // object class / capability
  string track_id = 2;
  string camera_id = 3;
  int32 time_window_sec = 4;
  int32 limit = 5;
}

message ObjectHit {
  string track_id = 1;
  string class = 2;
  string camera_id = 3;
  float confidence = 4;
  string scene_l1 = 5;
  string scene_l2 = 6;
  google.protobuf.Timestamp observed_at = 7;
  map<string, string> labels = 8;
  repeated float bbox = 9;        // [x1, y1, x2, y2]
}

message QueryObjectsResponse {
  repeated ObjectHit results = 1;
}

message QueryScenesRequest {
  string level1 = 1;
  string camera_id = 2;
  int32 time_window_sec = 3;
  int32 limit = 4;
}

message SceneHit {
  string camera_id = 1;
  string level1 = 2;
  string level2 = 3;
  float confidence = 4;
  google.protobuf.Timestamp observed_at = 5;
  repeated string specialists = 6;
}

message QueryScenesResponse {
  repeated SceneHit results = 1;
}

message QueryDetectionsRequest {
  string type = 1;                // alert / detection type
  string camera_id = 2;
  int32 time_window_sec = 3;
  int32 limit = 4;
}

message DetectionHit {
  string id = 1;
  string type = 2;
  string camera_id = 3;
  string track_id = 4;
  float confidence = 5;
  string summary = 6;
  google.protobuf.Timestamp observed_at = 7;
  map<string, string> labels = 8;
}

message QueryDetectionsResponse {
  repeated DetectionHit results = 1;
}

message QueryTranscriptsRequest {
  string contains = 1;            // substring match
  string camera_id = 2;
  int32 time_window_sec = 3;
  int32 limit = 4;
}

message TranscriptHit {
  string id = 1;
  string text = 2;
  string camera_id = 3;
  float confidence = 4;
  google.protobuf.Timestamp observed_at = 5;
  string speaker_id = 6;
}

message QueryTranscriptsResponse {
  repeated TranscriptHit results = 1;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;              // "ok" | "degraded"
  string version = 2;
  bool clickhouse_ok = 3;
  bool nats_ok = 4;
  string detail = 5;
}
