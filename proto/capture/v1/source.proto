syntax = "proto3";

package capture.v1;

option cc_enable_arenas = true;
option go_package = "github.com/agentjetson/core/gen/go/capture/v1;capturev1";

import "google/protobuf/timestamp.proto";

// Lightweight source lifecycle event for dynamic registration.
// NATS subjects: cv.source.up | cv.source.down | cv.source.heartbeat
// Edge may publish JSON with the same field names when protos are unavailable.
message SourceEvent {
  // up | down | heartbeat
  string event = 1;
  // Logical camera id (front-cam-01, bodycam-12, …) — must match profiles
  string source_id = 2;
  google.protobuf.Timestamp timestamp = 3;
  // Optional human role hint (does not override camera_profiles)
  string role_hint = 4;
  map<string, string> labels = 5;
}
